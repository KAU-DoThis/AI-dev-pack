# Jeff에 보내는 지시문과 선택지 설명 (한국어). 추론 탭의 "설명 저장" 버튼이 이 파일을 덮어쓴다.
# Jeff는 영어로 학습된 모델이지만 한국어도 읽는다 (10/12 비교). 선택지 id 목록은 labels.yaml 이 기준.
instructions: 이 거래는 가맹점 사전·퍼지 매칭·임베딩으로 분류되지 않았어. 자체 작은 모델이 소비 카테고리를 고를 수 있는지, 사용자에게 물어야 하는지 정해.
options:
  slm: 가맹점이나 받는 사람 이름으로 무엇을 샀는지 짐작할 수 있음 (동네 식당, 회사 이름, 앱스토어 결제) → 자체 작은 모델이 카테고리를 고름.
  ask: 데이터로 무엇을 샀는지 알 수 없음 (PAYCO 같은 결제대행, 오픈마켓, 사람에게 보낸 송금) → 사용자에게 무엇이었는지 물어봄.

# Jeff에 보내는 지시문과 선택지 설명 (한국어). 추론 탭의 "설명 저장" 버튼이 이 파일을 덮어쓴다.
# Jeff는 영어로 학습된 모델이지만 한국어도 읽는다 (10/12 비교). 선택지 id 목록은 labels.yaml 이 기준.
instructions: Fintris 가계부가 이 거래를 어떻게 처리할지 정해. 가맹점이나 사용자가 저장한 Profile로 용도가 분명할 때만 자동 처리해. 데이터로 용도를 알 수 없으면 사용자에게
  물어봐.
options:
  auto: 용도가 분명함 (잘 알려진 가맹점이거나 사용자가 저장한 Profile과 일치) → 사용자를 귀찮게 하지 않고 자동 분류.
  slm: 용도는 분명하지만, 사내 작은 모델이 쓴 짧고 친근한 안내를 사용자에게 보여줘야 함.
  external: 월간 리포트처럼 긴 자유 설명이 필요해서 큰 외부 모델만 쓸 수 있음.
  ask: 데이터로 용도를 알 수 없음 (모르는 사람, PAYCO 같은 결제대행, 새 반복 송금) → 사용자에게 무엇인지 물어봄.

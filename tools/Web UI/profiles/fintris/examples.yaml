# 추론 탭 예시 거래. 시연·동작 확인용이다. 평가 시험셋에 넣지 않는다 (시험셋은 실제 데이터로 따로 잠금).
# 기준: BE 기능명세서 F-20 — 1~3단계가 놓쳐서 Jeff(4단계)까지 내려오는 거래만 둔다.
# expect = 명세서 처리 규칙상 나와야 하는 결과. "항상 묻는 거래: 간편결제·오픈마켓, 1만 원 이상 개인 송금".
# 칸 이름은 명세서 transaction(occurred_at, amount, direction, merchant_or_payee)과 같게. 금액은 양수 + direction.

examples:
  - name: 명동칼국수 2호점 (사전에 없는 동네 가게)
    expect: slm
    state:
      merchant_or_payee: 명동칼국수 2호점
      amount: 9000
      direction: out
      occurred_at: "2026-10-16T12:40"

  - name: (주)우아한형제들 (법인명만 찍힘)
    expect: slm
    state:
      merchant_or_payee: (주)우아한형제들
      amount: 23500
      direction: out
      occurred_at: "2026-10-16T19:10"

  - name: APPLE.COM/BILL (영문 결제)
    expect: slm
    state:
      merchant_or_payee: APPLE.COM/BILL
      amount: 4400
      direction: out
      occurred_at: "2026-10-15T03:00"

  - name: PAYCO 42,000원 (간편결제, 품목 모름)
    expect: ask
    state:
      merchant_or_payee: PAYCO
      amount: 42000
      direction: out
      occurred_at: "2026-10-17T20:15"

  - name: 홍길동 50,000원 (개인 송금)
    expect: ask
    state:
      merchant_or_payee: 홍길동
      amount: 50000
      direction: out
      occurred_at: "2026-10-17T21:30"
